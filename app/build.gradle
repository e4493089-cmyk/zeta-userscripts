plugins { id 'com.android.application' }
android {
    namespace 'io.github.zetatools.gecko'
    compileSdk 37
    defaultConfig {
        applicationId 'io.github.zetatools.gecko'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'org.mozilla.geckoview:geckoview:160.0.20261116130455' }
