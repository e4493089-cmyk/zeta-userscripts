name: Android APK Preview
on:
  push:
    branches: [android-app-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch pinned public script assets
        run: |
          mkdir -p app/src/main/assets
          for file in zeta-kakaotalk-theme.user.js zeta-capture-user-mask.user.js zeta-room-manager.user.js zeta-chat-search.user.js; do
            curl --fail --silent --show-error --retry 3 "https://raw.githubusercontent.com/e4493089-cmyk/zeta-userscripts/23ba6ec4f393f6c10f49d9904c02fd73b7a37053/$file" -o "app/src/main/assets/$file"
            grep -q '==UserScript==' "app/src/main/assets/$file"
          done
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZETA-Tools-Android-0.1.0-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
