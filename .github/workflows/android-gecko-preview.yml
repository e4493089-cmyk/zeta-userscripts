name: Gecko Android APK Preview
on:
  push:
    branches: [android-gecko-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Bundle pinned public theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('zeta-kakaotalk-theme.user.js').read_text()
          assert '// ==UserScript==' in src
          guard="(function(){if(location.origin==='https://frame.pingpong.ai' && (location.pathname!=='/v1/index.html'||new URLSearchParams(location.hash.slice(1)).get('host')!=='https://zeta-ai.io'))return;\n"
          Path('app/src/main/assets/theme/theme.js').write_text(guard+src+'\n})();\n')
          PY
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ZETA-Tools-Gecko-0.2.0-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
