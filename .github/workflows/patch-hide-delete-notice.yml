name: Patch hide delete notice

on:
  push:
    paths:
      - '.github/workflows/patch-hide-delete-notice.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide delete start notice
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zeta-kakaotalk-theme.user.js
          git commit -m "fix: hide delete start notice"
          git push

# trigger
