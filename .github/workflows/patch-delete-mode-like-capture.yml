name: Patch delete mode like capture

on:
  push:
    paths:
      - '.github/workflows/patch-delete-mode-like-capture.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch theme
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path('zeta-kakaotalk-theme.user.js')
          s = path.read_text(encoding='utf-8')
          s = s.replace('// @version      3.50.1', '// @version      3.50.2', 1)
          s = s.replace('zeta-kakaotalk-theme.user.js?v=3.50.1', 'zeta-kakaotalk-theme.user.js?v=3.50.2')
          badge = base64.b64decode('').decode()
          if badge not in s:
              raise SystemExit('delete badge block not found')
          s = s.replace(badge, '\n', 1)
          marker = "\n    /* =========================================================\n       v3.48.2 - 마지막 메시지 컨트롤 4버튼 + 메시지 액션 바텀시트\n"
          if marker not in s:
              raise SystemExit('insert marker not found')
          block = base64.b64decode('').decode()
          s = s.replace(marker, block + marker, 1)
          path.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zeta-kakaotalk-theme.user.js
          git commit -m "style: align delete selection with capture mode"
          git push
