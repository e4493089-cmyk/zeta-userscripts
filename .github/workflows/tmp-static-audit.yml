name: Temporary static audit

on:
  push:
    paths:
      - '.github/workflows/tmp-static-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply behavior-neutral cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ['zeta-capture-ooc-hide.user.js', 'zeta-fullscreen.user.js']:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if not s.endswith('\n'):
                  p.write_text(s + '\n', encoding='utf-8')

          readme = '\n'.join([
              'Zeta Userscripts - GitHub automatic update package',
              '',
              'Current public userscripts in this repository:',
              '1. zeta-kakaotalk-theme.user.js',
              '2. zeta-capture-user-mask.user.js',
              '3. zeta-capture-ooc-hide.user.js',
              '4. zeta-room-manager.user.js',
              '5. zeta-fullscreen.user.js',
              '',
              'Keep these filenames unchanged. Each userscript contains its own Tampermonkey update/download URL.',
              'Increase @version only when releasing an actual script update.',
              ''
          ])
          Path('README.txt').write_text(readme, encoding='utf-8')
          PY
      - name: Verify syntax and whitespace
        run: |
          set -e
          for f in *.js; do node --check "$f"; done
          git diff --check
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.txt zeta-capture-ooc-hide.user.js zeta-fullscreen.user.js
          git commit -m "chore: tidy userscript repository without behavior changes"
          git push